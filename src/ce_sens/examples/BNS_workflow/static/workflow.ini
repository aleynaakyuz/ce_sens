[workflow]
; meaningless
start-time = 0
end-time = 10

[workflow-ifos]
CE30 =

[executables]
inference = ${which:pycbc_inference}
plot = ${which:pycbc_inference_plot_posterior}

[inference]
nprocesses = 16
force = 
seed = 0
verbose =

[plot]
z-arg = snr
plot-injection-parameters =

[pegasus_profile-inference]
condor|request_memory = 24 GB
condor|request_disk = 16 GB
condor|request_cpus = 16
condor|error = error.txt
condor|log = job.log
condor|getenv = True
condor|accounting_group = sugwg.astro
condor|max_materialize = 1000

[pegasus_profile]
pycbc|submit-directory = ./
