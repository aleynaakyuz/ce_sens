[model]
name = relative
low-frequency-cutoff = 5.1
high-frequency-cutoff = 2000
epsilon = 0.05

no-save-data =

marginalize_phase = True
marginalize_distance = True
marginalize_distance_param = distance
marginalize_distance_interpolator = True
marginalize_distance_density = 500, 500
marginalize_distance_samples = 10000

[data]
instruments = CE40 CE20

analysis-start-time = -17000
analysis-end-time = 10

pad-data = 8
channel-name = CE40:STRAIN CE20:STRAIN
fake-strain-flow = CE40:5.1 CE20:5.1
fake-strain-seed = CE40:44 CE20:45
fake-strain-sample-rate = 8192
sample-rate = 8192
strain-high-pass = 4.8

[sampler]
name = dynesty
dlogz = 0.5
nlive = 1000
#bootstrap = 1000

[variable_params]
; waveform parameters that will vary in MCMC
tc =
distance =

mchirp =
eta =

lambda_tilde =
delta_lambda_tilde =

inclination =
polarization =

[static_params]
; waveform parameters that will not change in MCMC
approximant = TaylorF2
f_lower = 5.1
f_ref = 5.1

[prior-inclination]
name = sin_angle

[prior-polarization]
name = uniform_angle

[waveform_transforms-mass1+mass2]
; transform from mchirp, eta to mass1, mass2 for waveform generation
name = mchirp_eta_to_mass1_mass2

[waveform_transforms-lambda1]
name = custom
inputs = delta_lambda_tilde, lambda_tilde, mass1, mass2
lambda1 = lambda1_from_delta_lambda_tilde_lambda_tilde(delta_lambda_tilde, lambda_tilde,  mass1, mass2)

[waveform_transforms-lambda2]
name = custom
inputs = delta_lambda_tilde, lambda_tilde, mass1, mass2
lambda2 = lambda2_from_delta_lambda_tilde_lambda_tilde(delta_lambda_tilde, lambda_tilde, mass1, mass2)
