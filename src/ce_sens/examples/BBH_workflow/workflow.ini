[workflow]
; meaningless
start-time = 0
end-time = 10

[workflow-ifos]
CE40 =

[executables]
inference_first = ${which:pycbc_inference}
plot = ${which:pycbc_inference_plot_posterior}
demarg = ${which:pycbc_inference_model_stats}
priors = ${which:write_priors}
inference_second = ${which:pycbc_inference}
bound_check = ${which:bound_check}
snr_check = ${which:snr_check}

[inference_first]
nprocesses = 1
force = 
seed = 0
verbose = 

[inference_second]
nprocesses = 4
force = 
seed = 0
verbose =

[demarg]
nprocesses = 4
reconstruct-parameters =
force =
verbose =

[pegasus_profile-inference_first]
condor|request_memory = 4 GB
condor|request_disk = 1 GB
condor|request_cpus = 1
condor|error = error.txt
condor|log = job.log
condor|getenv = True
env|OMP_NUM_THREADS=1
condor|accounting_group_user = aakyuz_inference_first

[pegasus_profile-inference_second]
condor|request_memory = 4 GB
condor|request_disk = 1 GB
condor|request_cpus = 4
condor|error = error.txt
condor|log = job.log
condor|getenv = True
env|OMP_NUM_THREADS=1
condor|accounting_group_user = aakyuz_inference_second

[pegasus_profile-demarg]
condor|request_memory = 4 GB
condor|request_disk = 1 GB
condor|request_cpus = 4
condor|error = error.txt
condor|log = job.log
condor|getenv = True
env|OMP_NUM_THREADS=1
condor|accounting_group_user = aakyuz_demarg

[pegasus_profile-priors]
condor|request_memory = 1 GB
condor|request_disk = 250 MB
condor|request_cpus = 1
condor|error = error.txt
condor|log = job.log
condor|getenv = True
env|OMP_NUM_THREADS=1

[pegasus_profile-bound_check]
condor|request_memory = 1 GB
condor|request_disk = 250 MB
condor|request_cpus = 1
condor|error = error.txt
condor|log = job.log
condor|getenv = True
env|OMP_NUM_THREADS=1

[pegasus_profile-snr_check]
condor|request_memory = 1 GB
condor|request_disk = 250 MB
condor|request_cpus = 1
condor|error = error.txt
condor|log = job.log
condor|getenv = True
env|OMP_NUM_THREADS=1

[pegasus_profile]
pycbc|submit-directory = ./
pycbc|primary_site = condorpool_symlink
env|KICKSTART_TMP = /home/aakyuz/runs7/PE/workflow_BBH/kstmp
env|PEGASUS_WN_TMP = /home/aakyuz/runs7/PE/workflow_BBH/kstmp
