[model]
name = marginalized_time
low-frequency-cutoff = 5.1
high-frequency-cutoff = 2000

sample_rate = 8192

no-save-data =

marginalize_vector_params = tc, polarization, ra, dec
marginalize_vector_samples = 10000

marginalize_phase = False

marginalize_distance = True
marginalize_distance_param = distance
marginalize_distance_interpolator = True
marginalize_distance_density = 100, 100
marginalize_distance_samples = 10000

[data]
instruments = CE30A CE30B
asd-file = CE30A:/home/aakyuz/runs7/ce_strain/cosmic_explorer_30km_strain.txt CE30B:/home/aakyuz/runs7/ce_strain/cosmic_explorer_30km_strain.txt

fake-strain-from-file = CE30A:/home/aakyuz/runs7/ce_strain/cosmic_explorer_30km_strain.txt CE30B:/home/aakyuz/runs7/ce_strain/cosmic_explorer_30km_strain.txt
fake-strain-seed = CE30A:44 CE30B:45
fake-strain-flow = CE30A:5.1 CE30B:5.1
channel-name = CE30A:STRAIN CE30B:STRAIN
sample-rate = 8192

strain-high-pass = 4.8

pad-data = 8

[sampler]
name = dynesty
dlogz = 0.5
sample = rwalk

[variable_params]
; waveform parameters that will vary in MCMC
q =
mchirp =
inclination =
distance =
polarization =
coa_phase =
tc =

ra =
dec =

[static_params]
; waveform parameters that will not change in MCMC
approximant = IMRPhenomXPHM
f_lower = 5.1
f_ref = 5.1

[prior-coa_phase]
; coalescence phase prior
name = uniform_angle

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle

[waveform_transforms-mass1+mass2]
name = mchirp_q_to_mass1_mass2
